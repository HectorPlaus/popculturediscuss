<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier List</title>
    <link rel="stylesheet" href="../css/tierlist-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

</head>

<body>
    <header id="logoheader"></header>
    <ul class="navbar">
        <div class="menu">
            <li><a href="../index.html">Home</a></li>
            <li><a href="mode.html">Mode</a></li>
            <li><a href="tierlist.html" class="active">Tierlist</a></li>
        </div>
        <button id="toggle-theme" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
    </ul>
    </nav>
    <h2 id="selected-category"></h2>
    <div class="sort-controls">
        <label for="sort-order">Ordenar personajes:</label>
        <select id="sort-order">
            <option value="name">Alfabético</option>
            <option value="extra">Fecha de estreno</option>
        </select>
    </div>
    <div id="tierlist-div">
        <div id="tierlist-container"></div>
        <div id="unassigned-characters"></div>
        <div id="settings-overlay" class="settings-overlay"></div>
        <div id="settings-window" class="settings-window" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="settings-content">
                <button id="close-settings" class="close-btn" aria-label="Cerrar ajustes">&times;</button>
                <h2 id="settings-title">Ajustes de fila</h2>
                <p class="settings-description">Personaliza la fila actual para que se adapte mejor a tu tierlist.</p>

                <div class="settings-section">
                    <label for="row-title">Nombre del apartado</label>
                    <input type="text" id="row-title" name="row-title" maxlength="20" placeholder="Ej. S, A, Especial...">
                </div>

                <div class="settings-section">
                    <label for="background-color">Color de fondo</label>
                    <input type="color" id="background-color" name="background-color">
                </div>

                <div class="settings-section">
                    <span class="settings-section-title">Orden de filas</span>
                    <div class="settings-actions">
                        <button id="add-row-above" type="button">Añadir arriba</button>
                        <button id="add-row-below" type="button">Añadir abajo</button>
                    </div>
                </div>

                <div class="settings-section danger-section">
                    <button id="delete-row" type="button" class="danger-btn">Eliminar fila</button>
                </div>
            </div>
        </div>

    </div>

    <script src="../js/tierlist.js"></script>
    <script src="../js/theme.js"></script>
</body>

</html>
